<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Developer Toolkit</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<aside id="sidebar">

  <h1>API Developer Toolkit</h1>
  <p class="tagline">cURL, API, JSON, Auth &amp; Webhook tools</p>

  <input id="search" type="text" placeholder="Search tools..." />

  <nav id="nav"></nav>

</aside>


<main id="main">

  <h2 id="tool-title">Loading...</h2>
  <p id="tool-desc"></p>

  <div class="grid">

    <section class="panel">

      <div class="panel-header">
        <span>Input</span>
        <button id="exampleBtn">Example</button>
      </div>

      <div id="input-fields"></div>

    </section>


    <section class="panel">

      <div class="panel-header">
        <span id="output-label">Output</span>
      </div>

      <div id="output"><pre></pre></div>

    </section>

  </div>

  <div class="actions">
    <button id="runBtn" class="primary">Run</button>
    <button id="copyBtn">Copy Output</button>
    <button id="clearBtn">Clear</button>
  </div>

</main>


<script src="js/app.js"></script>
<script src="js/curl.js"></script>
<script src="js/api.js"></script>
<script src="js/json.js"></script>
<script src="js/auth.js"></script>
<script src="js/webhooks.js"></script>

</body>
</html>
