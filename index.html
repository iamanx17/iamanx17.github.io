<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />

  <title>curl2code — API Developer Toolkit</title>

  <meta name="description"
        content="curl2code turns a cURL command into working code in 9 languages, and bundles the everyday API tools — JSON formatting and type generation, JWT decoding, encoding helpers and webhook signing — into one fast, offline-friendly page." />

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b8cff'/><text x='16' y='23' font-size='20' font-family='monospace' font-weight='bold' fill='white' text-anchor='middle'>c</text></svg>" />
</head>

<body>

<aside id="sidebar">

  <a class="brand" href="#">
    <span class="brand-mark">c2</span>
    <span class="brand-name">curl<span>2code</span></span>
  </a>

  <p class="tagline">
    Paste a request, get working code. Plus the JSON, auth and
    webhook tools you reach for every day.
  </p>

  <div class="search-wrap">
    <input id="search" type="text" placeholder="Search tools..." autocomplete="off" spellcheck="false" />
    <span class="kbd">/</span>
  </div>

  <nav id="nav"></nav>

</aside>

<div id="scrim"></div>


<main id="main">
  <div class="main-inner">

    <div id="topbar">
      <button id="menuBtn" aria-label="Toggle tool menu">☰</button>
      <span class="brand-name">curl<span>2code</span></span>
    </div>

    <div class="tool-head">
      <div>
        <h2 id="tool-title">Loading…</h2>
        <p id="tool-desc"></p>
      </div>
      <span class="badge" id="tool-cat"></span>
    </div>

    <div class="grid">

      <section class="panel">

        <div class="panel-header">
          <span>Input</span>
          <button id="exampleBtn" class="ghost" type="button">Load example</button>
        </div>

        <div id="input-fields"></div>

      </section>


      <section class="panel">

        <div class="panel-header">
          <span id="output-label">Output</span>
          <button id="copyBtn" class="ghost" type="button">Copy</button>
        </div>

        <div id="output"><div class="placeholder">Output appears here as you type.</div></div>

      </section>

    </div>

    <div class="actions">
      <button id="runBtn" class="primary" type="button">Run</button>
      <button id="copyBtn2" type="button">Copy output</button>
      <button id="clearBtn" type="button">Clear</button>
    </div>

    <footer>
      Runs entirely in your browser — nothing you paste leaves this page.
      <kbd>/</kbd> to search &nbsp;·&nbsp; <kbd>⌘</kbd>/<kbd>Ctrl</kbd> + <kbd>Enter</kbd> to run.
    </footer>

  </div>
</main>


<div id="toast"></div>


<script src="js/app.js"></script>
<script src="js/curl.js"></script>
<script src="js/api.js"></script>
<script src="js/json.js"></script>
<script src="js/auth.js"></script>
<script src="js/webhooks.js"></script>

</body>
</html>
